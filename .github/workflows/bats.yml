name: bats

on:
  # No paths filter: this is a required status check. A path-filtered required
  # check is skipped (never reported) on PRs that don't touch the filtered
  # paths, leaving the ruleset waiting forever on an absent context. Running on
  # every PR keeps the required context always present.
  pull_request:

# The group key leads with a literal token naming the workflow that owns it. A
# key built only from context (`${ github.workflow }`) is one a called
# reusable also produces, because `github.workflow` resolves to the caller
# inside a called workflow; both land in one group and the reusable's queue
# cancels the run that called it.
concurrency:
  group: bats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    # One 4-vCPU runner runs the suite CPU-bound: twice as many jobs as cores
    # finishes no sooner, so only more runners shorten it. scripts/run-tests
    # decides which files each shard runs; the matrix only sets how many shards.
    name: bats shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # About 5x this job's median successful run, rounded up to the minute.
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the suite's tools
        # The action lists each tool and why the suite needs it; the cache seed
        # in .github/workflows/cache-seed.yml runs the same action on dev.
        uses: ./.github/actions/setup-bats-suite

      - name: Run bats tests
        # scripts/run-tests owns which suites run, in what order, and which
        # shard runs each. .githooks/pre-push runs the same script over the
        # whole suite and .githooks/pre-commit over staged test files, so the
        # local gates and this job cannot drift apart.
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: ./scripts/run-tests --all --shard "$SHARD"

  bats:
    # The required status check. A skipped required check counts as passing,
    # so this job runs whatever the shards concluded and fails unless every
    # shard passed.
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "bats shards: $RESULT"
          [ "$RESULT" = success ]
