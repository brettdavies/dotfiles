# Adds a listener on this host's tailnet addresses, so Rex for Mac reaches the
# login server at <host>.<tailnet>.ts.net:7297. tailscaled identifies each
# caller, and /etc/rex/accounts.jsonc decides which account each one gets.
#
# A drop-in can only replace ExecStart whole, so the line below repeats the
# packaged command and appends --extra-listen. tests/rex-login-server-deploy.bats
# fails when the packaged command changes under it.
[Unit]
After=tailscaled.service
Requires=tailscaled.service

[Service]
ExecStart=
ExecStart=/usr/bin/rex login-server --listen unix:///run/rex/login-server.sock --accounts /etc/rex/accounts.jsonc --runtime-root /run/rex --log-format text --pam-service rex-login-server --extra-listen tailnet://:7297
