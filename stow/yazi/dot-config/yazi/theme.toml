# yazi theme config
# Stow package: dotfiles/stow/yazi/dot-config/yazi/theme.toml
# Symlinked to: ~/.config/yazi/theme.toml
#
# Flavor: catppuccin-mocha — dark theme matching Ghostty's #1e1e1e background.
# Installed via: ya pkg add yazi-rs/flavors:catppuccin-mocha
# To change flavor: update `use` below and run `ya pkg install`.

#:schema https://yazi-rs.github.io/schemas/theme.json

[flavor]
use = "catppuccin-mocha"

# git.yazi sign overrides — the plugin's default signs for staged, unstaged,
# added, deleted, and updated are blank spaces, which show nothing. Overridden
# to plain letters matching `git status -s` shorthand, so the state reads on any
# background and on the hovered row, which the plugin draws without color. Each
# sign is two columns wide so they align across rows; a modification sits in the
# column `git status -s` gives it: index (staged) first, worktree (unstaged)
# second. Colors are git.yazi's defaults, since catppuccin-mocha sets no [git].
[git]
staged_sign    = "M "
unstaged_sign  = " M"
added_sign     = "A "
deleted_sign   = "D "
updated_sign   = "U "
untracked_sign = "? "
ignored_sign   = "! "
