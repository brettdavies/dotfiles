# Once a user's pipes reserve more than fs.pipe-user-pages-soft buffer slots
# (default 16384, sized for 1024 pipes of 16 slots), the kernel creates every
# new pipe for that user at 2 slots (8 KiB) instead of 64 KiB and refuses
# F_SETPIPE_SZ growth with EPERM. A desktop app with a hundred helper processes,
# plus the shells and tmux panes of a busy session, passes that, and from then
# on any tool that writes more than 8 KiB before the other end reads, such as
# actionlint feeding shellcheck, blocks forever.
#
# 0 turns the soft limit off rather than raising it. Over the limit the kernel
# keeps allocating pipes, only smaller, so the limit caps nothing; the count is
# of reserved slots, not pages holding data; and pipe data pages are already
# charged to the user's memory cgroup. On a single-user host it guards against
# no other user and costs every program that relies on the default size.
# fs.pipe-user-pages-hard, the setting that does cap allocation, keeps its
# default of 0 (off).
#
# 60- sorts after package drop-ins (50-*) and before 99-sysctl.conf, the link
# to /etc/sysctl.conf, so a value set there still wins.
fs.pipe-user-pages-soft = 0
