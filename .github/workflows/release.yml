name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    # Primary loop guard: [skip ci] in the changelog commit message
    # prevents GitHub from triggering any workflows on that push.
    # Secondary guard: skip if the push came from the bot (fallback).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_RELEASE_TOKEN }}

      - name: Compute CalVer version
        id: version
        env:
          TZ: America/Los_Angeles
        run: |
          set -euo pipefail
          TODAY=$(date +%Y.%m.%d)
          LATEST=$(git tag -l "${TODAY}" "${TODAY}.*" \
            --sort=-version:refname | head -1)

          if [ -z "$LATEST" ]; then
            VERSION="$TODAY"
          elif [ "$LATEST" = "$TODAY" ]; then
            VERSION="${TODAY}.1"
          else
            SUFFIX="${LATEST#${TODAY}.}"
            if [[ "$SUFFIX" =~ ^[0-9]+$ ]]; then
              VERSION="${TODAY}.$((SUFFIX + 1))"
            else
              echo "ERROR: Malformed tag: $LATEST" >&2
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}

      - name: Get release body
        id: release-body
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.version }} --unreleased --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet && exit 0
          git commit -m "chore(release): ${{ steps.version.outputs.version }} [skip ci]"
          git tag "${{ steps.version.outputs.version }}"
          git push --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.release-body.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
