# yazi theme config
# Stow package: dotfiles/stow/yazi/dot-config/yazi/theme.toml
# Symlinked to: ~/.config/yazi/theme.toml
#
# Flavor: catppuccin-mocha — dark theme matching Ghostty's #1e1e1e background.
# Installed via: ya pkg add yazi-rs/flavors:catppuccin-mocha
# To change flavor: update `use` below and run `ya pkg install`.

#:schema https://yazi-rs.github.io/schemas/theme.json

[flavor]
use = "catppuccin-mocha"

# git.yazi sign overrides — defaults for modified/added/deleted/updated are
# blank spaces with colored backgrounds (color-only indicator). Overridden to
# plain letters matching `git status -s` shorthand so the indicator is legible
# on any background. Each sign is two columns wide (letter + space) so they
# align across rows. Colors inherit from catppuccin-mocha's git defaults.
[git]
modified_sign  = "M "
added_sign     = "A "
deleted_sign   = "D "
updated_sign   = "U "
untracked_sign = "? "
ignored_sign   = "! "
