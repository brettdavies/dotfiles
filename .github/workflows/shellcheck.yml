# The job id `shellcheck` is a required status check in both rulesets under
# .github/rulesets/, so it stays as-is even though the job now covers workflow
# linting too. Splitting actionlint into its own job would mean registering a
# new required context; folding it in here keeps it blocking without that.
name: ShellCheck

on:
  # No paths filter: this is a required status check. A path-filtered required
  # check is skipped (never reported) on PRs that don't touch the filtered
  # paths, leaving the ruleset waiting forever on an absent context. Running on
  # every PR keeps the required context always present. The job validates fixed
  # file sets, so unrelated PRs pass quickly.
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The group key leads with a literal token naming the workflow that owns it. A
# key built only from context (`${ github.workflow }`) is one a called
# reusable also produces, because `github.workflow` resolves to the caller
# inside a called workflow; both land in one group and the reusable's queue
# cancels the run that called it.
concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install ShellCheck
        # Local composite action, so this job and .github/workflows/bats.yml
        # (whose tests/lint-shell.bats shells out to shellcheck) install one
        # pinned version instead of inheriting the runner image's.
        uses: ./.github/actions/setup-shellcheck

      - name: Lint shell
        # scripts/lint-shell owns which files are covered and the per-category
        # flags: hooks, config/shell fragments, scripts, dot-profile, bats tests,
        # the claude hooks, and the stow-managed bin helpers. .githooks/pre-push
        # runs this exact command and .githooks/pre-commit runs the same script
        # over staged paths, so local gates and CI cannot drift apart.
        run: ./scripts/lint-shell --all

      - name: Guard test environments
        # Fails a test that resets HOME, TMPDIR, an XDG_* directory, a tool
        # home, or PATH's whole value. .githooks/pre-push runs this exact
        # command, and scripts/core-env-allowlist.tsv holds the exceptions.
        run: ./scripts/core-env-guard.sh

      - name: Install actionlint
        uses: ./.github/actions/setup-actionlint

      - name: Lint workflows
        # Runs after ShellCheck is on PATH on purpose: actionlint shells out to
        # shellcheck for `run:` blocks, and without it those checks are skipped
        # silently rather than failing.
        run: ./scripts/lint-workflows --all
