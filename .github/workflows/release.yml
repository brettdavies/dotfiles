name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_RELEASE_TOKEN }}

      - name: Compute CalVer version
        id: version
        env:
          TZ: America/Los_Angeles
        run: |
          set -euo pipefail
          TODAY=$(date +%Y.%m.%d)
          LATEST=$(git tag -l "${TODAY}" "${TODAY}.*" \
            --sort=-version:refname | head -1)

          if [ -z "$LATEST" ]; then
            VERSION="$TODAY"
          elif [ "$LATEST" = "$TODAY" ]; then
            VERSION="${TODAY}.1"
          else
            SUFFIX="${LATEST#${TODAY}.}"
            if [[ "$SUFFIX" =~ ^[0-9]+$ ]]; then
              VERSION="${TODAY}.$((SUFFIX + 1))"
            else
              echo "ERROR: Malformed tag: $LATEST" >&2
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Extract release notes from CHANGELOG.md
        id: release-body
        run: |
          set -euo pipefail
          NOTES=$(awk '/^## \[/{if(n++)exit}n' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ steps.version.outputs.version }}"
          fi
          {
            echo "content<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.release-body.outputs.content }}
          token: ${{ secrets.CI_RELEASE_TOKEN }}
