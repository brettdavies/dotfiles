name: bats

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'stow/**'
      - 'scripts/**'
      - '.githooks/**'
      - '.github/workflows/bats.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install bats-core + zsh + jq
        # zsh: shell-config.bats syntax-checks dot-zshrc / dot-zshenv / dot-zprofile.
        # jq: heredoc-pr-guard.bats invokes jaq for fake JSON construction.
        # Symlink jq as jaq (jaq is a jq-compatible Rust reimplementation; tests
        # use only the -n / -r / --arg / -e flags + standard filter syntax).
        run: |
          sudo apt-get install -y bats zsh jq
          sudo ln -sf "$(command -v jq)" /usr/local/bin/jaq

      - name: Run bats tests
        run: bats tests/*.bats
