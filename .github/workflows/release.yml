name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The group key leads with a literal token naming the workflow that owns it, so
# it cannot collide with a key a caller or callee produces from context alone.
# This group never cancels: a run killed part way leaves a half-finished
# release, and this job creates a tag and publishes a GitHub release.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_RELEASE_TOKEN }}

      - name: Compute CalVer version
        id: version
        env:
          TZ: America/Los_Angeles
        run: |
          set -euo pipefail
          TODAY=$(date +%Y.%m.%d)
          LATEST=$(git tag -l "${TODAY}" "${TODAY}.*" \
            --sort=-version:refname | head -1)

          if [ -z "$LATEST" ]; then
            VERSION="$TODAY"
          elif [ "$LATEST" = "$TODAY" ]; then
            VERSION="${TODAY}.1"
          else
            SUFFIX="${LATEST#"${TODAY}."}"
            if [[ "$SUFFIX" =~ ^[0-9]+$ ]]; then
              VERSION="${TODAY}.$((SUFFIX + 1))"
            else
              echo "ERROR: Malformed tag: $LATEST" >&2
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Extract release notes from CHANGELOG.md
        id: release-body
        run: |
          set -euo pipefail
          NOTES=$(awk '/^## \[/{if(n++)exit}n' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ steps.version.outputs.version }}"
          fi
          {
            echo "content<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.release-body.outputs.content }}
          token: ${{ secrets.CI_RELEASE_TOKEN }}
