name: Setup bats suite
description: Install every tool the bats suite needs, so the shard jobs and the cache seed install the same set.

# The shard jobs in .github/workflows/bats.yml run the suite; the cache seed in
# .github/workflows/cache-seed.yml runs only this action, on dev, so the caches
# it saves land where a pull request's first run can restore them.

runs:
  using: composite
  steps:
    - name: Install ShellCheck
      # tests/lint-shell.bats and the per-file lint tests shell out to
      # shellcheck, so this job needs the same pinned version as the
      # ShellCheck workflow or the two disagree about identical files.
      uses: ./.github/actions/setup-shellcheck

    - name: Install actionlint
      # tests/lint-workflows.bats runs actionlint on its fixtures and skips
      # those tests when actionlint is missing.
      uses: ./.github/actions/setup-actionlint

    - name: Install bats-core
      # Pinned rather than apt-installed: several suites use `run !`, which
      # needs bats >= 1.5.0, and the distro package version is whatever the
      # runner image happens to ship.
      # The action caches its own install (actions/cache internally), so a warm
      # run restores rather than clones. Its cache key carries bats-version and
      # nothing else, so an unset version keys every release the same and the
      # first one cached is the one every later run gets. Keep the version in
      # step with the Homebrew formula the local gates run.
      uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
      with:
        bats-version: 1.14.0
        # No suite loads bats-support, bats-assert, bats-detik, or bats-file,
        # and the action installs all four unless told not to.
        support-install: false
        assert-install: false
        detik-install: false
        file-install: false
        # The action downloads bats through api.github.com. Without a token those calls share the runner's anonymous
        # rate limit, which a busy runner exhausts, and the install fails with HTTP 403.
        github-token: ${{ github.token }}

    - name: Install yq
      # auto-format-ignores.bats and auto-format-config-resolution.bats assert
      # on behaviour the hook derives from a markdownlint config, and the hook
      # reads every config through yq. Without it the hook silently reads none
      # of them, so those suites would pass without exercising anything.
      # Deliberately not apt: the distro `yq` is kislyuk/yq, a different tool
      # that rejects the v4 syntax the hook uses. See the action for detail.
      uses: ./.github/actions/setup-yq

    - name: Install Claude Code
      # agent-slot-foreign-head.bats proves against the real binary, with a refused API, what its flags keep a head from
      # running. Without it those tests skip, and a change in what the flags mean would pass here.
      uses: ./.github/actions/setup-claude-code

    - name: Install uv
      # md-align-tables.bats runs the table aligner's unit tests through
      # `uv run --with wcwidth`, because the script imports wcwidth at load.
      # Without uv that suite skips rather than exercising anything.
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        # The cache holds only the wcwidth wheel. Restoring it took 0.2-1.3 s,
        # and the one suite that needs it runs about 0.3 s faster with it.
        enable-cache: false

    - name: Install zsh + stow + jq + trash-cli
      # zsh: shell-config.bats syntax-checks dot-zshrc / dot-zshenv / dot-zprofile.
      # stow: stow-deploy-args.bats checks exit codes; without stow the script
      #   exits with EXIT_DEPENDENCY (3) instead of EXIT_USAGE (2).
      # jq: heredoc-pr-guard.bats invokes jaq for fake JSON construction.
      # trash-cli: the agent-slot suites trash slot clones with the real
      #   trash-put into a sandbox trash, since teardown purges the entry it wrote.
      uses: ./.github/actions/setup-apt-packages
      with:
        packages: zsh stow jq trash-cli

    - name: Name jq as jaq
      # jaq is a jq-compatible Rust reimplementation; tests use only the
      # -n / -r / --arg / -e flags and standard filter syntax.
      shell: bash
      run: sudo ln -sf "$(command -v jq)" /usr/local/bin/jaq
