# yazi config
# Stow package: dotfiles/stow/yazi/dot-config/yazi/yazi.toml
# Symlinked to: ~/.config/yazi/yazi.toml
#
# Packages (plugins/flavors) are managed by `ya pkg` and NOT tracked in stow.
# On a new machine, run `ya pkg install` to restore from package.toml.
#
# Section names: yazi.toml uses [mgr], keymap.toml uses [mgr] — NOT [manager].
# This is a common gotcha; wrong section names are silently ignored.

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# Panel ratios: [parent-dir, current-dir, preview]
# Default is [1, 4, 3]. Bumped preview for wider markdown rendering.
ratio = [1, 2, 5]
# Show hidden files (dotfiles) by default. Toggle with `.` key.
show_hidden = true

[opener]
# On Linux, `edit` and `mac-view` hand the file to the Mac the session is driven
# from (mac-open), and yazi runs only the first opener a rule lists, so the
# `||` fallback is how the local editor still takes the file when the Mac cannot.
# `block = true` pauses yazi while the command holds the terminal; `%s` is every
# selected path. Entries marked `for = "linux"` never run on the Mac.
edit = [
  { run = "mac-open edit %s || ${EDITOR:-micro} %s", block = true, desc = "VS Code on the Mac", for = "linux" },
  { run = "$EDITOR %s", block = true, desc = "$EDITOR", for = "unix" },
]
edit-local = [
  { run = "$EDITOR %s", block = true, desc = "$EDITOR", for = "unix" },
]
mac-view = [
  { run = "mac-open view %s", block = true, desc = "Mac default app", for = "linux" },
]

# PDF "read" opener: a readable view rather than the cramped preview pane.
#   macOS → Preview.app
#   Linux → the Mac's PDF app, else pdftotext into a tempfile opened in micro
# The braces make the whole text view the fallback: `||` and `&&` bind equally
# in sh, so without them pdftotext would also run after a successful hand-off.
# micro needs the tempfile because it can't start its TUI on a piped stdin.
read-pdf = [
  { run = 'open %s', desc = "Preview.app", for = "macos" },
  { run = 'mac-open view %s || { tmp=$(mktemp) && pdftotext -layout %s "$tmp" && micro "$tmp"; rm -f "$tmp"; }', block = true, desc = "Mac PDF app, else text in micro", for = "linux" },
]

# The full rule table, replacing yazi's built-in one rather than prepending to
# it, so the `*` catch-all can send unknown binaries to the Mac without
# shadowing the text rules above it. Rows other than folder, PDF, image,
# audio/video, and the catch-all are yazi 26.9.1's preset; diff against
# yazi-config/preset/yazi-default.toml in the yazi source on each upgrade.
[open]
rules = [
  # Bulk rename and bulk create open their list in the first blocking editor for
  # these names and read it back when that editor exits, so it must stay local:
  # the hand-off returns at once and the list would come back unchanged.
  { url = "bulk-{rename,create}.txt", use = [ "edit-local" ] },
  { mime = "folder/*", use = [ "edit-local", "open", "reveal" ] },
  { mime = "text/*", use = [ "edit", "reveal" ] },
  { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "reveal" ] },
  { mime = "inode/empty", use = [ "edit", "reveal" ] },
  { mime = "application/pdf", use = "read-pdf" },
  { mime = "image/*", use = [ "mac-view", "open", "reveal" ] },
  { mime = "{audio,video}/*", use = [ "mac-view", "play", "reveal" ] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
  { mime = "vfs/{absent,stale}", use = "download" },
  { mime = "trash/**", use = [ "open", "trash" ] },
  { url = "*", use = [ "mac-view", "open", "reveal" ] },
]

# Markdown preview via piper plugin + glow
# piper pipes the file through glow for rendered markdown in the preview pane.
# $w = preview pane width (injected by piper). Requires: glow (brew install glow).
# Note: glow's dark style shows ## / ### prefixes on h2/h3 — this is intentional glamour behavior.
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# PDF preview via piper + pdftotext (text extraction, legible in TTY)
[[plugin.prepend_previewers]]
url = "*.pdf"
run = 'piper -- pdftotext -layout "$1" - 2>/dev/null'

# git.yazi fetchers — populate each file (and the parent dir entry) with git
# status so the linemode registered in init.lua can render M/A/D/? markers
# next to filenames. The `id` field is omitted because yazi >= v26.1.22 doesn't
# require it. See: https://github.com/yazi-rs/plugins/tree/main/git.yazi
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
