# ── TERMINAL ──────────────────────────────────────────────────────
set -g set-titles on                                 # push title to terminal (Ghostty window title)
set -g set-titles-string "#S · #W"                  # session · window name
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:Tc"              # true color passthrough
set -ga terminal-features ",xterm-ghostty:usstyle"   # undercurl via Ghostty
set -g set-clipboard on                              # OSC 52 clipboard (works over SSH via Ghostty)
set-option -g focus-events on                        # needed by Claude Code and some TUIs
set -sg escape-time 0                                # eliminate Esc delay
set -g extended-keys always                          # critical: preserves complex key sequences for Claude Code

# ── PREFIX ────────────────────────────────────────────────────────
# Ctrl+Space is ergonomic and doesn't conflict with Claude Code bindings
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# ── USABILITY ─────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
setw -g mode-keys vi
set -g detach-on-destroy off     # don't exit tmux when last pane closes

# ── KEYBINDINGS ───────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Splits always open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation without prefix (Alt+h/l)
bind -n M-h previous-window
bind -n M-l next-window

# No confirmation on pane close
bind X kill-pane

# ── LAZYGIT POPUP ─────────────────────────────────────────────────
# prefix+g opens lazygit centered, context-aware to current pane's directory
bind g display-popup -E -xC -yC -w 85% -h 85% -d "#{pane_current_path}" lazygit

# ── PANE DIMMING ──────────────────────────────────────────────────
# Active pane matches Ghostty theme; inactive gets a warm amber tint
# Amber/golden tones promote alertness without stress (vs red which triggers fight-or-flight)
set -g window-style "bg=#3c2010"                     # inactive pane bg (dark amber tint)
set -g window-active-style "bg=#1e1e1e"              # active pane bg (matches Ghostty theme)

# ── STATUS BAR ────────────────────────────────────────────────────
# Colors match Ghostty's VSCode Dark theme (background = #1e1e1e)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e1e,fg=#d4d4d4"
set -g status-left "#[fg=#4fc1ff,bold] #S #[default]  "
set -g status-right "#[fg=#6a9955] %H:%M #[fg=#858585]· #[fg=#569cd6]%d %b "
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-current-format "#[fg=#ce9178,bold] #I #W #[default]"
set -g window-status-format "#[fg=#858585] #I #W "
set -g window-status-separator ""

# ── PLUGINS ───────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'          # clipboard (uses OSC 52 over SSH)
set -g @plugin 'tmux-plugins/tmux-resurrect'     # manual save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto-save + auto-restore

# Resurrect: restore pane contents and Claude Code sessions
set -g @resurrect-capture-pane-contents 'on'

# Continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
