# The agent-slots server: `tmux -L agent-slots -f ~/.config/tmux/slots.conf`.
# It loads no plugins, so resurrect and continuum never save or restore slot
# sessions; agent-slot owns their lifecycle.
source-file -F '#{d:current_file}/base.conf'

# A client shows one slot session; when that session ends the client exits
# instead of switching to another slot's session.
set -g detach-on-destroy on
set -g set-titles off
# `all` passes a status report through even from a pane that is not visible.
set -g allow-passthrough all

# Rewrites each pane's stored status report to its terminal, so a client that
# reattaches shows the current state.
set-hook -g client-attached "run-shell -b '~/.claude/slot-status.sh --replay #{socket_path}'"
# Paired with the tmux-prune-orphans-slots.timer systemd unit as a daily safety net.
set-hook -g client-detached "run-shell -b '~/dotfiles/scripts/tmux/prune-orphans.sh -L agent-slots'"

bind r source-file ~/.config/tmux/slots.conf \; display-message "slots config reloaded"
