[Service]
# Bind to loopback only. Reach paths:
#   - Host-local processes via 127.0.0.1.
#   - Tailnet peers via a `tailscale serve --service=svc:ollama 11434`
#     forwarder that proxies HTTPS into loopback.
#   - Docker containers via a host-network socat sidecar that listens on
#     the docker bridge gateway and forwards to 127.0.0.1:11434.
Environment="OLLAMA_HOST=127.0.0.1:11434"

# Keep the model resident in VRAM forever; idle eviction starves bursty
# local LLM workloads that re-hit the same model.
Environment="OLLAMA_KEEP_ALIVE=-1"

# 8-bit KV cache halves attention memory at negligible quality cost.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# Flash attention is required by some gemma4 builds and is a no-op otherwise.
Environment="OLLAMA_FLASH_ATTENTION=1"

# Single-request concurrency. Local Ollama doesn't gain from parallel batch
# decode on a single GPU, and parallel requests blow context budgets.
Environment="OLLAMA_NUM_PARALLEL=1"

# Allow up to 4 models resident simultaneously. With KEEP_ALIVE=-1 set above,
# each loaded model stays in VRAM forever; Ollama LRU-evicts only under VRAM
# pressure. 24GB GPU + arctic-embed (1.2G) + qwen3:1.7b (1.4G) + gemma4:e2b
# (7G) fits comfortably; gemma4:26b (21G) forces eviction of the others when
# loaded — Ollama handles that swap cleanly so concurrent embed and chat
# consumers stop crashing the embed runner.
Environment="OLLAMA_MAX_LOADED_MODELS=4"

# Allow CORS from any local origin — needed by the obsidian markitdown plugin,
# devtools, and ad-hoc test scripts. Loopback-only bind makes this safe.
Environment="OLLAMA_ORIGINS=*"
