# yazi config
# Stow package: dotfiles/stow/yazi/dot-config/yazi/yazi.toml
# Symlinked to: ~/.config/yazi/yazi.toml
#
# Packages (plugins/flavors) are managed by `ya pkg` and NOT tracked in stow.
# On a new machine, run `ya pkg install` to restore from package.toml.
#
# Section names: yazi.toml uses [mgr], keymap.toml uses [mgr] — NOT [manager].
# This is a common gotcha; wrong section names are silently ignored.

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# Panel ratios: [parent-dir, current-dir, preview]
# Default is [1, 4, 3]. Bumped preview for wider markdown rendering.
ratio = [1, 2, 5]
# Show hidden files (dotfiles) by default. Toggle with `.` key.
show_hidden = true

[opener]
# Use $EDITOR from shell profile (macOS: code --wait, Linux: micro).
# `block = true` pauses yazi while the editor is open, resumes on exit.
# `%s` is yazi's placeholder for selected file path(s).
edit = [
  { run = "$EDITOR %s", block = true, desc = "$EDITOR", for = "unix" },
]

# PDF "read" opener — pressing `o` on a PDF gives a fully selectable, searchable
# text view, not the cramped preview pane. Per-platform routing via `for`:
#   macOS → Preview.app (visual rendering, native text selection)
#   Linux → pdftotext into a tempfile, opened in micro
# Linux needs the tempfile hop because micro can't initialize its TUI when
# stdin is consumed by a pipe; the trailing `rm -f` cleans up after micro exits.
read-pdf = [
  { run = 'open %s', desc = "Preview.app", for = "macos" },
  { run = 'tmp=$(mktemp) && pdftotext -layout %s "$tmp" && micro "$tmp"; rm -f "$tmp"', block = true, desc = "text in micro", for = "linux" },
]

# Route PDFs to `read-pdf` instead of the generic `open`. `prepend_rules` adds
# this in front of yazi's default rules without replacing them.
[open]
prepend_rules = [
  { mime = "application/pdf", use = "read-pdf" },
]

# Markdown preview via piper plugin + glow
# piper pipes the file through glow for rendered markdown in the preview pane.
# $w = preview pane width (injected by piper). Requires: glow (brew install glow).
# Note: glow's dark style shows ## / ### prefixes on h2/h3 — this is intentional glamour behavior.
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# PDF preview via piper + pdftotext (text extraction, legible in TTY)
[[plugin.prepend_previewers]]
url = "*.pdf"
run = 'piper -- pdftotext -layout "$1" - 2>/dev/null'

# git.yazi fetchers — populate each file (and the parent dir entry) with git
# status so the linemode registered in init.lua can render M/A/D/? markers
# next to filenames. The `id` field is omitted because yazi >= v26.1.22 doesn't
# require it. See: https://github.com/yazi-rs/plugins/tree/main/git.yazi
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
