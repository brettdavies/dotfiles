# Canonical version: 2026.11.01 (generic)
#
# Source repo guard-main-docs wrapper that calls the fleet's reusable workflow.
# Copy to .github/workflows/guard-main-docs.yml in repos with guarded docs.
#
# Blocks compound-engineering docs (plans, solutions, brainstorms, reviews)
# from being merged into main. Only needs pull-requests: read.
#
# To guard more paths, add the `with: extra_paths:` line below. Its entries are
# globs: `**/` spans any depth, `*` and `?` stay within one segment, a trailing
# `/` guards the subtree, and a plain entry is a prefix or an exact path.
# scripts/release/guarded-paths.sh reads this line, so keep it on one line in
# single quotes.
#
name: Guard main from engineering docs

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  guard-docs:
    uses: brettdavies/.github/.github/workflows/guard-main-docs.yml@main
    # with:
    #   extra_paths: 'CONCEPTS.md,docs/designs/'
