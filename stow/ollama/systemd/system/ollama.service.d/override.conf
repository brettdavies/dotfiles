[Service]
# Bind to loopback only. Containers reach ollama through the per-stack
# socat forwarder bound on the docker bridge gateway (see
# ~/dev/paxel-main/local/docker-compose.yml ollama-forwarder service).
# The tailscale `svc:ollama` service is also fed from loopback via
# `tailscale serve --service=svc:ollama 11434`.
Environment="OLLAMA_HOST=127.0.0.1:11434"

# Keep the model resident in VRAM forever; idle eviction starves the daily
# qmd / paxel workloads that re-hit the same model in bursts.
Environment="OLLAMA_KEEP_ALIVE=-1"

# 8-bit KV cache halves attention memory at negligible quality cost.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# Flash attention is required by some gemma4 builds and is a no-op otherwise.
Environment="OLLAMA_FLASH_ATTENTION=1"

# Single-request concurrency. Local Ollama doesn't gain from parallel batch
# decode on a single GPU, and parallel requests blow context budgets.
Environment="OLLAMA_NUM_PARALLEL=1"

# Allow CORS from any local origin — needed by the obsidian markitdown plugin,
# devtools, and ad-hoc test scripts. Loopback-only bind makes this safe.
Environment="OLLAMA_ORIGINS=*"
