name: ancskill
root: ~/dev/agentnative-skill

windows:
  - main:
      layout: main-vertical
      panes:
        - yazi
        -
        - lazygit

on_project_first_start: |
  (
    sleep 0.3
    tmux resize-pane -t ancskill:main.1 -x "33%"
    tmux resize-pane -t ancskill:main.3 -y "33%"
  ) & disown
