# The operator's default server. Shared settings live in base.conf, resolved
# beside this file so the stowed copy and the repo copy each find their own.
source-file -F '#{d:current_file}/base.conf'

# ── HOOKS ─────────────────────────────────────────────────────────
# Sweep orphan clients (pty == (none)) whenever a client disconnects.
# Paired with the tmux-prune-orphans.timer systemd unit as a daily safety net.
set-hook -g client-detached "run-shell -b '~/dotfiles/scripts/tmux/prune-orphans.sh'"

# ── KEYBINDINGS ───────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ── PLUGINS ───────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'          # clipboard (uses OSC 52 over SSH)
set -g @plugin 'tmux-plugins/tmux-resurrect'     # manual save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto-save + auto-restore

# Resurrect: restore pane contents and Claude Code sessions
set -g @resurrect-capture-pane-contents 'on'

# Continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
